org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# 14 GB laptop: 8G heap starved the desktop (systemd-oomd killed GNOME Shell, 2026-11-10).
kotlin.daemon.jvmargs=-Xmx1G
android.useAndroidX=true
# Opted out of AGP 9's new DSL / built-in Kotlin — the Flutter Gradle plugin
# throws a ClassCastException (ApplicationExtensionImpl$AgpDecorated_Decorated
# cannot be cast to AbstractAppExtension) when newDsl=true on this Flutter
# version, even though it's the template default. Old DSL path is stable.
android.newDsl=false
android.builtInKotlin=false
