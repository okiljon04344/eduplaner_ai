org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template.
# Must stay false: cloud_functions and firebase_analytics still
# unconditionally `apply plugin: 'kotlin-android'` in their own
# android/build.gradle (as of the versions in pubspec.lock) — turning on
# built-in Kotlin makes AGP9 treat that as a hard error ("no longer
# required"), not just a warning. file_picker is pinned to a 10.3.x release
# specifically because it still self-applies Kotlin the same way (11.x+
# switched to relying on built-in Kotlin on AGP9+, which conflicts with this).
android.builtInKotlin=false
