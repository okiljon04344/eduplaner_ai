org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Opted out of AGP 9's new DSL / built-in Kotlin — the Flutter Gradle plugin
# throws a ClassCastException (ApplicationExtensionImpl$AgpDecorated_Decorated
# cannot be cast to AbstractAppExtension) when newDsl=true on this Flutter
# version, even though it's the template default. Old DSL path is stable.
android.newDsl=false
android.builtInKotlin=false
