name: edu_planner_ai
description: AIを活用したスマート学習管理アプリ
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.2.0

  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  firebase_messaging: ^16.5.0
  firebase_analytics: ^12.4.6
  cloud_functions: ^6.3.6

  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.3

  fl_chart: ^0.69.0
  flutter_animate: ^4.5.0
  table_calendar: ^3.1.2
  intl: ^0.20.2
  google_fonts: ^6.2.1

  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

  shared_preferences: ^2.3.2
  toastification: ^2.1.0
  uuid: ^4.4.2
  dio: ^5.7.0
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.0
  permission_handler: ^11.3.1
  collection: ^1.18.0
  equatable: ^2.0.5

  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  file_picker: ^12.0.0
  lottie: ^3.3.1
  cupertino_icons: ^1.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.3
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/l10n/
  fonts:
    - family: NotoSansJP
      fonts:
        - asset: assets/fonts/NotoSansJP-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansJP-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansJP-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansJP-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#0B0B1E"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  web:
    generate: true
    image_path: "assets/images/app_icon.png"
    background_color: "#0B0B1E"
    theme_color: "#0B0B1E"

