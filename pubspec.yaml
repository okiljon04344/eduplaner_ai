name: edu_planner_ai
description: AIを活用したスマート学習管理アプリ
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.2.0

  firebase_core: ^3.4.0
  firebase_auth: ^5.2.0
  cloud_firestore: ^5.3.0
  firebase_messaging: ^15.1.0
  firebase_analytics: ^11.3.0

  google_generative_ai: ^0.4.6
  google_sign_in: ^6.2.1

  fl_chart: ^0.69.0
  flutter_animate: ^4.5.0
  table_calendar: ^3.1.2
  intl: ^0.20.2
  google_fonts: ^6.2.1

  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  toastification: ^2.1.0
  uuid: ^4.4.2
  dio: ^5.7.0
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.0
  permission_handler: ^11.3.1
  collection: ^1.18.0
  equatable: ^2.0.5

  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.3
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
  fonts:
    - family: NotoSansJP
      fonts:
        - asset: assets/fonts/NotoSansJP-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansJP-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansJP-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansJP-Bold.ttf
          weight: 700
